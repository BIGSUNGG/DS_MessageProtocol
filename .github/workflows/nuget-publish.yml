name: Publish NuGet packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Compute package version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION (from tag $TAG)"

      - name: Build solution (Release)
        run: dotnet build MessageProtocol.sln -c Release

      # 게이트: 태그가 테스트에 실패하는 트리를 가리키면 패키지가 나가지 않아야 한다 —
      # 로컬 게이트는 절차 준수를 보장하지만 파이프라인 자체도 스스로 검증해야 한다(2026-09-08).
      - name: Run unit tests (Release, both TFMs)
        run: dotnet test MessageProtocol.sln -c Release --no-build

      - name: Run acceptance scenarios (Sandbox)
        run: dotnet run --project Sandbox/MessageProtocol.Sandbox -c Release

      - name: Pack library projects (Release)
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          OUT="${{ github.workspace }}/artifacts"
          dotnet pack "Source/MessageProtocol.Core" \
            -c Release -p:Version="$V" -o "$OUT"
          dotnet pack "Source/MessageProtocol.CodeGenerator" \
            -c Release -p:Version="$V" -o "$OUT"
          dotnet pack "Source/MessageProtocol" \
            -c Release -p:Version="$V" -o "$OUT"

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_API_KEY}" ]; then
            echo "::error::NUGET_API_KEY secret is not set."
            echo "::error::Add the secret in repository Settings, Actions."
            exit 1
          fi
          shopt -s nullglob
          for f in artifacts/*.nupkg; do
            dotnet nuget push "$f" \
              --api-key "$NUGET_API_KEY" \
              --source "https://api.nuget.org/v3/index.json" \
              --skip-duplicate
          done
